spring.application.name=price-consolidation-api
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pricing}
spring.datasource.username=${DB_USER:pricing}
spring.datasource.password=${DB_PASSWORD:pricing}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

pricing.cache.retention=30m

pricing.providers.a.base-url=${PROVIDER_A_URL:http://localhost:9001}
pricing.providers.a.connect-timeout=100ms
pricing.providers.a.read-timeout=300ms
pricing.providers.b.base-url=${PROVIDER_B_URL:http://localhost:9002}
pricing.providers.b.connect-timeout=200ms
pricing.providers.b.read-timeout=750ms
pricing.providers.b.background-read-timeout=1000ms
