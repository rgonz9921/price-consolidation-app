spring.application.name=price-consolidation-api
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pricing}
spring.datasource.username=${DB_USER:pricing}
spring.datasource.password=${DB_PASSWORD:pricing}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

pricing.cache.retention=30m

pricing.providers.a.base-url=${PROVIDER_A_URL:http://localhost:9001}
pricing.providers.a.connect-timeout=100ms
pricing.providers.a.read-timeout=300ms
pricing.providers.b.base-url=${PROVIDER_B_URL:http://localhost:9002}
pricing.providers.b.connect-timeout=200ms
pricing.providers.b.read-timeout=750ms
pricing.providers.b.background-read-timeout=1000ms

resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.record-exceptions=com.rgonz.pricing.exception.ProviderTimeoutException,com.rgonz.pricing.exception.ProviderUnavailableException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=com.rgonz.pricing.exception.ProviderRateLimitedException,com.rgonz.pricing.exception.ProviderRejectedException,io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.providerA.base-config=default
resilience4j.circuitbreaker.instances.providerA.slow-call-duration-threshold=250ms
resilience4j.circuitbreaker.instances.providerB.base-config=default
resilience4j.circuitbreaker.instances.providerB.slow-call-duration-threshold=900ms

resilience4j.retry.instances.providerA.max-attempts=2
resilience4j.retry.instances.providerA.wait-duration=50ms
resilience4j.retry.instances.providerA.enable-randomized-wait=true
resilience4j.retry.instances.providerA.randomized-wait-factor=0.5
resilience4j.retry.instances.providerA.retry-exceptions=com.rgonz.pricing.exception.ProviderUnavailableException
resilience4j.retry.instances.providerB.max-attempts=1

resilience4j.ratelimiter.instances.providerB.limit-for-period=1
resilience4j.ratelimiter.instances.providerB.limit-refresh-period=250ms
resilience4j.ratelimiter.instances.providerB.timeout-duration=0

resilience4j.bulkhead.instances.providerA.max-concurrent-calls=50
resilience4j.bulkhead.instances.providerA.max-wait-duration=0
resilience4j.bulkhead.instances.providerB.max-concurrent-calls=10
resilience4j.bulkhead.instances.providerB.max-wait-duration=0

pricing.resilience.rate-limited-pause=1s
pricing.resilience.background-permit-wait=1s

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
